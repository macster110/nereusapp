[package]
name = "nereus-core"
description = "Database access and export formats (MATLAB, R, Tethys XML) for Nereus"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
deadpool-postgres = "0.14.2"
flate2 = "1.1.10"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "json"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
webpki-roots = "1.0.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "chrono"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["net", "macros", "rt-multi-thread", "io-util"] }
